name: Build Choreo Komari Agent

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream komari-monitor/komari-agent tag/branch/SHA. Leave empty for latest release tag."
        required: false
        type: string
      choreo_suffix:
        description: "SemVer prerelease suffix appended to upstream version."
        required: false
        default: "choreo.1"
        type: string
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout choreo repo
        uses: actions/checkout@v4
        with:
          path: choreo-repo

      - name: Resolve upstream ref and Choreo tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          INPUT_SUFFIX: ${{ inputs.choreo_suffix }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_REF:-}" ]; then
            UPSTREAM_REF="$INPUT_REF"
          else
            UPSTREAM_REF=$(gh release view --repo komari-monitor/komari-agent --json tagName --jq .tagName)
          fi

          UPSTREAM_VERSION="${UPSTREAM_REF#v}"
          SUFFIX="${INPUT_SUFFIX:-choreo.1}"
          CHOREO_VERSION="${UPSTREAM_VERSION}-${SUFFIX}"
          CHOREO_TAG="v${CHOREO_VERSION}"

          echo "upstream_ref=${UPSTREAM_REF}" >> "$GITHUB_OUTPUT"
          echo "choreo_version=${CHOREO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "choreo_tag=${CHOREO_TAG}" >> "$GITHUB_OUTPUT"

          echo "Upstream ref: ${UPSTREAM_REF}"
          echo "Choreo tag: ${CHOREO_TAG}"

      - name: Check release existence
        id: release_exists
        env:
          GH_TOKEN: ${{ github.token }}
          CHOREO_TAG: ${{ steps.version.outputs.choreo_tag }}
        run: |
          set -euo pipefail
          if gh release view "$CHOREO_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $CHOREO_TAG already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream agent
        if: steps.release_exists.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: komari-monitor/komari-agent
          ref: ${{ steps.version.outputs.upstream_ref }}
          path: agent-src
          fetch-depth: 0

      - name: Set up Go
        if: steps.release_exists.outputs.exists != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-src/go.mod
          cache-dependency-path: agent-src/go.sum

      - name: Apply Choreo agent patch
        if: steps.release_exists.outputs.exists != 'true'
        working-directory: agent-src
        run: |
          set -euo pipefail
          bash ../choreo-repo/agent/apply-choreo-endpoint.sh

      - name: Build multi-arch binaries
        if: steps.release_exists.outputs.exists != 'true'
        working-directory: agent-src
        env:
          CHOREO_TAG: ${{ steps.version.outputs.choreo_tag }}
        run: |
          set -euo pipefail
          # build_all.sh uses git describe; tag so version embeds Choreo mark
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Choreo endpoint patch for ${CHOREO_TAG}" || true
          git tag -f "$CHOREO_TAG"
          bash build_all.sh
          ls -la build

      - name: Publish release
        if: steps.release_exists.outputs.exists != 'true'
        working-directory: agent-src
        env:
          GH_TOKEN: ${{ github.token }}
          CHOREO_TAG: ${{ steps.version.outputs.choreo_tag }}
          UPSTREAM_REF: ${{ steps.version.outputs.upstream_ref }}
        run: |
          set -euo pipefail
          NOTES="Patched komari-agent for Choreo dual-prefix endpoints.

          Upstream: komari-monitor/komari-agent@${UPSTREAM_REF}

          Usage:
          \`\`\`bash
          ./komari-agent -e https://komari.example.com -t TOKEN --disable-auto-update
          \`\`\`

          Auto-derives:
          - HTTP: https://komari.example.com/api/clients/...
          - WS:   wss://ws.komari.example.com/default/komari/komari_ws/v1.0/api/clients/...

          See agent/AGENT.choreo.md in the deployment repo."

          gh release create "$CHOREO_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$CHOREO_TAG" \
            --notes "$NOTES" \
            ./build/komari-agent-*

  cleanup-runs:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 6
